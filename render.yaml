services:
  - type: web
    name: integrall-online
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: integrall-db
          property: connectionString
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: MERCADO_PAGO_USE_SANDBOX
        value: "false"
      - key: MERCADO_PAGO_PAYMENT_EXPIRATION_DAYS
        value: "3"
      - key: SHIPPING_MODE
        value: correios
      - key: ALLOW_PAYMENT_WITH_QUOTED_SHIPPING
        value: "false"
      - key: CORREIOS_USER
        sync: false
      - key: CORREIOS_ACCESS_CODE
        sync: false
      - key: CORREIOS_POSTAGE_CARD
        sync: false
      - key: CORREIOS_CONTRACT
        sync: false
      - key: CORREIOS_ORIGIN_CEP
        sync: false
      - key: CORREIOS_SERVICES
        value: "03298:PAC,03220:SEDEX"
      - key: JADLOG_TOKEN
        sync: false
      - key: JADLOG_CNPJ
        sync: false
      - key: JADLOG_CONTA
        sync: false
      - key: JADLOG_CONTRATO
        sync: false
      - key: JADLOG_MODALIDADE
        value: "3"
      - key: CARRIER_SPLIT_UNITS
        value: "12"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: INTEGRALL
      - key: ORDER_EXPIRE_DAYS
        value: "7"

databases:
  - name: integrall-db
    plan: basic-256mb
    region: oregon
    databaseName: integrall
    user: integrall
    ipAllowList: []
