services:
  - type: web
    name: integrall-online-test
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: integrall-db-test
          property: connectionString
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: MERCADO_PAGO_USE_SANDBOX
        value: "true"
      - key: SHIPPING_MODE
        value: quote
      - key: ALLOW_PAYMENT_WITH_QUOTED_SHIPPING
        value: "false"
      # Frete automático (preencha para testar em homologação; use CORREIOS_HOMOLOG=true)
      - key: CORREIOS_USER
        sync: false
      - key: CORREIOS_ACCESS_CODE
        sync: false
      - key: CORREIOS_POSTAGE_CARD
        sync: false
      - key: CORREIOS_ORIGIN_CEP
        sync: false
      - key: CORREIOS_HOMOLOG
        value: "true"
      - key: JADLOG_TOKEN
        sync: false
      - key: JADLOG_CNPJ
        sync: false
      - key: CARRIER_SPLIT_UNITS
        value: "12"
      # E-mail transacional (opcional no teste)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ORDER_EXPIRE_DAYS
        value: "7"

databases:
  - name: integrall-db-test
    plan: free
    region: oregon
    databaseName: integrall_test
    user: integrall_test
    ipAllowList: []
