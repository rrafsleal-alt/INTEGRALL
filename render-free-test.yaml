services:
  - type: web
    name: integrall-online-test
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: integrall-db-test
          property: connectionString
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: MERCADO_PAGO_USE_SANDBOX
        value: "true"
      - key: SHIPPING_MODE
        value: quote
      - key: ALLOW_PAYMENT_WITH_QUOTED_SHIPPING
        value: "false"

databases:
  - name: integrall-db-test
    plan: free
    region: oregon
    databaseName: integrall_test
    user: integrall_test
    ipAllowList: []
